# preseed.cfg
# Debian 13 (Trixie) preseed file for Packer + VirtualBox build
#
# Mirrors the setup of the Ubuntu autoinstall:
#   - English / US keyboard / UTC
#   - Single ext4 partition on /dev/sda
#   - Creates 'packer' user with sudo NOPASSWD and SSH key auth
#   - Installs openssh-server and sudo so Packer can connect after reboot
#   - GRUB to /dev/sda
#   - Auto-reboot when done
#
# Documentation:
#   https://www.debian.org/releases/trixie/amd64/apb.en.html

# ============================================================================
# LOCALIZATION
# ============================================================================

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

# ============================================================================
# NETWORK
# ============================================================================

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-vb-template
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string

# ============================================================================
# MIRROR
# ============================================================================

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ============================================================================
# CLOCK / TIMEZONE
# ============================================================================

d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true

# ============================================================================
# ACCOUNTS
# Skip root account (no password = locked).
# Create 'packer' user. Password is set but SSH key auth is what we use.
# Password hash below is for 'packer' — generated with:
#   mkpasswd -m sha-512 packer
# ============================================================================

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true

d-i passwd/user-fullname string Packer
d-i passwd/username string packer
d-i passwd/user-password-crypted password $6$0EJglu9KGEpBt5cO$tCCR3rWF2LtwCULnCWkGrp9XZmEopC31QY.uHTNIJBazaktsX2My8.2ZHGDGATlTPSUtNRqp9iUuMMvYDsefl0

# ============================================================================
# PARTITIONING
# Single ext4 root partition on /dev/sda. No swap, no LVM. Simple.
# ============================================================================

d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ============================================================================
# BASE SYSTEM
# ============================================================================

d-i base-installer/install-recommends boolean false

# ============================================================================
# APT SETUP
# Verified against https://www.debian.org/releases/trixie/arm64/apbs04.en.html
# ============================================================================

# Don't scan additional installation media (default: false, but be explicit)
d-i apt-setup/cdrom/set-first boolean false

# Don't keep the netinst CD as an apt source in the installed system
d-i apt-setup/disable-cdrom-entries boolean true

# Component selection
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false

# Update services
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# ============================================================================
# PACKAGE SELECTION
# Minimal set — just enough for Packer to SSH in and run install scripts.
# Everything else (docker, go, etc.) is installed by your provisioning
# scripts so the logic lives in one place.
# ============================================================================

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl ca-certificates
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

popularity-contest popularity-contest/participate boolean false

# ============================================================================
# BOOTLOADER
# ============================================================================

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# ============================================================================
# FINISH
# ============================================================================

d-i finish-install/reboot_in_progress note

# ============================================================================
# LATE COMMAND
# Runs at the end of the install, inside the installed system via
# in-target. This is where we set up sudo NOPASSWD and SSH key auth
# for the packer user so Packer can SSH in after reboot.
# ============================================================================

d-i preseed/late_command string \
    in-target sh -c 'echo "packer ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/packer'; \
    in-target chmod 440 /etc/sudoers.d/packer; \
    in-target mkdir -p /home/packer/.ssh; \
    in-target chmod 700 /home/packer/.ssh; \
    in-target sh -c 'echo "ssh-rsa  virtualbox universal keys" > /home/packer/.ssh/authorized_keys'; \
    in-target chmod 600 /home/packer/.ssh/authorized_keys; \
    in-target chown -R packer:packer /home/packer/.ssh
